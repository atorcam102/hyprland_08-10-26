[package]
name = "shotbar"
version = "0.1.0"
edition = "2021"
description = "Capturas de pantalla con historial temporal y arrastrar-y-soltar para Hyprland"
license = "MIT"

[dependencies]
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
gtk4-layer-shell = "0.8.1"
libc = "0.2.190"
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
