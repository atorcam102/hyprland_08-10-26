#
# Pantalla de bloqueo "Horizonte": hora fina y enorme, fecha espaciada,
# y una tarjeta abajo con el saludo y la contraseña. Colores: colors.conf (matugen).
# El diseño anterior está en hyprlock.conf.antes-horizonte

$ml4w_cache_folder = $HOME/.cache/ml4w/hyprland-dotfiles
source = colors.conf

$font      = JetBrainsMono Nerd Font
$fontThin  = JetBrainsMono Nerd Font ExtraLight
$fontBold  = JetBrainsMono Nerd Font Bold

general {
    ignore_empty_input = true
    hide_cursor = true
}

animations {
    enabled = true
    bezier = enfasis, 0.05, 0.7, 0.1, 1
    animation = fadeIn, 1, 5, enfasis
    animation = fadeOut, 1, 4, enfasis
    animation = inputFieldDots, 1, 2, enfasis
}

background {
    monitor =
    path = $ml4w_cache_folder/blurred_wallpaper.png
    brightness = 0.72
    contrast = 0.95
    vibrancy = 0.2
}

# --- Fecha, espaciada, sobre la hora ---
label {
    monitor =
    text = cmd[update:60000] LC_TIME=es_ES.UTF-8 date +"%A  ·  %-d de %B" | LC_ALL=es_ES.UTF-8 sed "s/.*/\\U&/"
    color = $primary
    font_size = 14
    font_family = $fontBold
    position = 0, 250
    halign = center
    valign = center
}

# --- Hora: fina y grande ---
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $on_surface
    font_size = 150
    font_family = $fontThin
    position = 0, 130
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(00000066)
}

# --- Tarjeta inferior ---
shape {
    monitor =
    size = 420, 170
    color = $surface_container
    rounding = 20
    border_size = 1
    border_color = $outline_variant
    position = 0, 90
    halign = center
    valign = bottom
    shadow_passes = 3
    shadow_size = 18
    shadow_color = rgba(00000080)
}

label {
    monitor =
    text = Hola, Albert
    color = $on_surface
    font_size = 15
    font_family = $fontBold
    position = 0, 205
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 360, 50
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    inner_color = $surface_container_high
    outer_color = $outline_variant
    font_color = $on_surface
    font_family = $font
    fade_on_empty = false
    placeholder_text = <i>Contraseña…</i>
    hide_input = false
    rounding = 14
    check_color = $primary
    fail_color = $error
    fail_text = <i>No es correcta ($ATTEMPTS)</i>
    capslock_color = $tertiary
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, 120
    halign = center
    valign = bottom
}

# --- Pie: firma ---
label {
    monitor =
    text = alberrtttt
    color = $outline
    font_size = 10
    font_family = $font
    position = 0, 30
    halign = center
    valign = bottom
}
