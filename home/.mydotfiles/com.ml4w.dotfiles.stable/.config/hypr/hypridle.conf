#
# Inactividad: qué pasa cuando Albert se levanta del ordenador

general {
    lock_cmd = pidof hyprlock || hyprlock                # un solo hyprlock a la vez
    before_sleep_cmd = loginctl lock-session             # bloquear antes de suspender
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # al volver, pantalla encendida a la primera
}

# 8 min: bajar el brillo
listener {
    timeout = 480
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 9 min: avisar de que se va a bloquear
listener {
    timeout = 540
    on-timeout = notify-send -a alberrtttt -u critical -t 55000 "¿Sigues ahí, Albert?" "Se bloquea en 1 minuto. Mueve el ratón para seguir."
    on-resume = swaync-client --close-latest
}

# 10 min: bloquear
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 min: apagar la pantalla
listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# 30 min: suspender
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
