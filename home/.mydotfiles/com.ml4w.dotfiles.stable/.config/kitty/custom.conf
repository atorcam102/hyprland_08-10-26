# Personal overrides (not touched by ML4W updates)
# Rediseño "Horizonte": más aire, pestañas planas, cristal (Hyprland difumina detrás).
# Los colores siguen en colors-matugen.conf. Anterior: custom.conf.antes-horizonte

font_family                 JetBrainsMono Nerd Font
font_size                   13
modify_font                 cell_height 118%
disable_ligatures           cursor

background_opacity          0.9
window_padding_width        14 18
placement_strategy          center

cursor_shape                beam
cursor_beam_thickness       2
cursor_trail                0
scrollback_lines            10000

# Pestañas: planas, abajo, separadas por aire
tab_bar_edge                bottom
tab_bar_style               separator
tab_separator               "  "
tab_bar_margin_width        10
tab_bar_margin_height       6 6
tab_bar_min_tabs            2
active_tab_font_style       bold
inactive_tab_font_style     normal
tab_title_template          " {index} · {title.split('/')[-1][:24]} "
active_tab_title_template   " {index} · {title.split('/')[-1][:24]} "

# Divisores entre ventanas de kitty
window_border_width         1pt
draw_minimal_borders        yes
inactive_text_alpha         0.85

copy_on_select              clipboard
mouse_hide_wait             2
map ctrl+shift+enter        new_window_with_cwd
map ctrl+shift+t            new_tab_with_cwd
